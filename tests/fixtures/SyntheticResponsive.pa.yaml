# Synthetic Canvas v3 fixture for browser rendering regression.
# No real SQL rows, permissions, user identities or private app content.
Screens:
  VisualRegression:
    Properties:
      Fill: =RGBA(248, 249, 252, 1)
    Children:
      - Header:
          Control: GroupContainer@1.3.0
          Properties:
            X: =0
            Y: =0
            Width: =App.Width
            Height: =100
            Fill: =RGBA(255, 255, 255, 1)
          Children:
            - Title:
                Control: Classic/Label@2.5.1
                Properties:
                  X: =24
                  Y: =18
                  Width: =300
                  Height: =44
                  Text: ="Synthetic regression"
                  Size: =20
      - DataGallery:
          Control: Classic/VerticalGallery@2.3.0
          Variant: Vertical
          Properties:
            X: =20
            Y: =130
            Width: =App.Width - 40
            Height: =350
            Items: =SQLTable
            WrapCount: =If(App.Width > 900, 3, If(App.Width > 600, 2, 1))
            TemplateSize: =292
            TemplatePadding: =8
            TemplateFill: =If(ThisItem.IsEnabled, Color.Green, Color.Red)
          Children:
            - GalleryRowIcon:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Switch(ThisItem.Category, "Operations", Icon.Settings, "Reporting", Icon.Document, Icon.Information)
                  X: =8
                  Y: =52
                  Width: =40
                  Height: =40
            - GalleryRowLabel:
                Control: Classic/Label@2.5.1
                Properties:
                  Text: =ThisItem.Title
                  Width: =200
                  Height: =40
      - Footer:
          Control: Classic/Label@2.5.1
          Properties:
            X: =20
            Y: =500
            Width: =App.Width - 40
            Height: =40
            Text: ="Verified independent control"
