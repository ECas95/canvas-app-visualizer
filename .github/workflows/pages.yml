name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Publish official Power Fx WebAssembly engine
        run: >
          dotnet publish powerfx-wasm/CanvasAppVisualizer.PowerFxWasm.csproj
          --configuration Release
          --output "$RUNNER_TEMP/powerfx-wasm"

      - name: Add Power Fx runtime to static site
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/powerfx-wasm/wwwroot/_framework/dotnet.js"
          mkdir -p dist/powerfx
          cp -R "$RUNNER_TEMP/powerfx-wasm/wwwroot/." dist/powerfx/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
