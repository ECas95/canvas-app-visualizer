name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  visual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Browser geometry and screenshots
        run: npm run test:visual
      - name: Upload synthetic preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-visual-regression
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 7
